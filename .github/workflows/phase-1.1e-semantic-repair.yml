name: Phase 1.1E Materialized Source Publisher

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: write
  actions: read

jobs:
  publish-materialized-source:
    if: ${{ startsWith(github.event.head_commit.message, 'Trigger Phase 1.1E materialized source publisher v37') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATERIALIZED_ARTIFACT_ID: '10318777142'
      EXPECTED_EXTRACTOR_SHA256: '503dd1d4f15ecec65c3abcc790173fd0ae742ab08cf0691e298d99b468c754f5'
      EXPECTED_TEST_SHA256: '31c08dd7210fbb553bfac5b683f551c4fd6c1f80e4e79692e55142b7095ae1b9'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - name: Download accepted materialized artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p materialized
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MATERIALIZED_ARTIFACT_ID}/zip" \
            -o materialized/source.zip
          unzip -q materialized/source.zip -d materialized/unpacked
          test -f materialized/unpacked/backend/app/services/guidance_raw_canonical_extractor.py
          test -f materialized/unpacked/backend/tests/test_guidance_v5_surgical_acceptance.py
      - name: Verify accepted source digests
        run: |
          test "$(sha256sum materialized/unpacked/backend/app/services/guidance_raw_canonical_extractor.py | awk '{print $1}')" = "${EXPECTED_EXTRACTOR_SHA256}"
          test "$(sha256sum materialized/unpacked/backend/tests/test_guidance_v5_surgical_acceptance.py | awk '{print $1}')" = "${EXPECTED_TEST_SHA256}"
      - name: Publish consolidated raw extractor
        run: |
          cp materialized/unpacked/backend/app/services/guidance_raw_canonical_extractor.py backend/app/services/guidance_raw_canonical_extractor.py
          cp materialized/unpacked/backend/tests/test_guidance_v5_surgical_acceptance.py backend/tests/test_guidance_v5_surgical_acceptance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/guidance_raw_canonical_extractor.py backend/tests/test_guidance_v5_surgical_acceptance.py
          git diff --cached --check
          git commit -m "Phase 1.1E: publish consolidated raw extractor"
          git push origin HEAD:phase-1.1e-canonical-guidance
