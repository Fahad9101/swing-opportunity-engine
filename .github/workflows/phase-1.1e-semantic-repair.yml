name: Phase 1.1E Semantic Repair

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: write

jobs:
  semantic-repair:
    if: ${{ startsWith(github.event.head_commit.message, 'Trigger Phase 1.1E semantic repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic repair batch
        run: python scripts/phase_1_1e_semantic_repair_v3.py
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run semantic regression suite
        working-directory: backend
        run: pytest -q tests/test_guidance_raw_canonical_extractor.py tests/test_guidance_canonical.py tests/test_guidance_intelligence.py
      - name: Publish repair batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/guidance_raw_canonical_extractor.py backend/app/services/guidance_raw_typed_extractor.py backend/app/services/guidance_raw_replay_differential_service.py backend/tests/test_guidance_raw_canonical_extractor.py
          git diff --cached --check
          git commit -m "Phase 1.1E: repair raw guidance semantic binding [semantic-repair]"
          git push origin HEAD:phase-1.1e-canonical-guidance
