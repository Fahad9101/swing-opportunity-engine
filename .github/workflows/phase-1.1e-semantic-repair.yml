name: Phase 1.1E Surgical V5 Acceptance

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: read
  actions: read

jobs:
  surgical-v5-acceptance:
    if: ${{ startsWith(github.event.head_commit.message, 'Trigger Phase 1.1E surgical v5 acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_ARTIFACT_ID: '10296727219'
      SEC_USER_AGENT: 'SOE-SurgicalV5Acceptance/1.0 (soe-validation@example.com)'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply surgical v5 candidate in working tree
        run: python scripts/phase_1_1e_v5_surgical_acceptance_v2.py
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Diagnose compact suffix ownership
        run: python scripts/phase_1_1e_v5_surgical_diagnostics.py
      - name: Run complete deterministic test suite
        env:
          DATABASE_URL: sqlite+pysqlite:///./soe_surgical_v5_acceptance.db
          PROVIDER_NAME: fixture
        run: python -m pytest -q
      - name: Download immutable acceptance artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p semantic-replay-source
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o semantic-replay-source/source.zip
          unzip -q semantic-replay-source/source.zip -d semantic-replay-source/unpacked
          test -f semantic-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json
      - name: Replay complete immutable SEC population
        run: |
          python -m app.cli_guidance_raw_replay_differential \
            semantic-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json \
            --output semantic-surgical-v5-acceptance.json \
            --min-interval 0.15 \
            --retries 3
      - name: Verify source integrity and print semantic footprint
        run: |
          python - <<'PY'
          import json
          r=json.load(open('semantic-surgical-v5-acceptance.json'))
          print(json.dumps({
            'documents_verified': f"{r['verified_source_count']}/{r['source_manifest_count']}",
            'fetch_failures': r['fetch_failure_count'],
            'hash_mismatches': r['hash_mismatch_count'],
            'extraction_errors': r.get('extraction_error_count', 0),
            'complete_tickers': f"{r['complete_ticker_count']}/{r['tickers_with_guidance_payload']}",
            'raw_typed_facts': r['raw_typed_fact_count'],
            'canonical_facts': r['canonical_fact_count'],
            'quarantined': r['quarantined_fact_count'],
            'classification_divergences': r['classification_divergence_count'],
            'divergence_tickers': [d['ticker'] for d in r.get('classification_divergences', [])],
          }, indent=2))
          assert r['source_manifest_count'] == 305
          assert r['verified_source_count'] == 305
          assert r['fetch_failure_count'] == 0
          assert r['hash_mismatch_count'] == 0
          assert r.get('extraction_error_count', 0) == 0
          assert r['complete_ticker_count'] == r['tickers_with_guidance_payload'] == 109
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase-1.1e-surgical-v5-acceptance
          path: semantic-surgical-v5-acceptance.json
          if-no-files-found: error
