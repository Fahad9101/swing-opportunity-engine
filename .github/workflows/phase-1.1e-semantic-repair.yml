name: Phase 1.1E Semantic Repair

# Trigger v11 semantic acceptance repair with full deterministic and immutable replay gates.
on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: write
  actions: read

jobs:
  semantic-repair:
    if: ${{ startsWith(github.event.head_commit.message, 'Trigger Phase 1.1E semantic repair') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_ARTIFACT_ID: '10296727219'
      SEC_USER_AGENT: 'SOE-SemanticRepair/1.0 (soe-validation@example.com)'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply narrowed semantic repair batch
        run: python scripts/phase_1_1e_semantic_repair_v11.py
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Print targeted semantic diagnostics
        run: python scripts/phase_1_1e_semantic_debug.py
      - name: Run complete deterministic test suite
        env:
          DATABASE_URL: sqlite+pysqlite:///./soe_semantic_repair.db
          PROVIDER_NAME: fixture
        run: python -m pytest -q
      - name: Download immutable acceptance artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p semantic-replay-source
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o semantic-replay-source/source.zip
          unzip -q semantic-replay-source/source.zip -d semantic-replay-source/unpacked
          test -f semantic-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json
      - name: Replay complete immutable SEC population
        run: |
          python -m app.cli_guidance_raw_replay_differential \
            semantic-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json \
            --output semantic-repair-v11-replay.json \
            --min-interval 0.15 \
            --retries 3
      - name: Enforce non-regression acceptance gate
        run: |
          python - <<'PY'
          import json
          report = json.load(open('semantic-repair-v11-replay.json'))
          summary = {
              'documents_verified': f"{report['verified_source_count']}/{report['source_manifest_count']}",
              'fetch_failures': report['fetch_failure_count'],
              'hash_mismatches': report['hash_mismatch_count'],
              'extraction_errors': report.get('extraction_error_count', 0),
              'complete_tickers': f"{report['complete_ticker_count']}/{report['tickers_with_guidance_payload']}",
              'raw_typed_facts': report['raw_typed_fact_count'],
              'canonical_facts': report['canonical_fact_count'],
              'quarantined': report['quarantined_fact_count'],
              'classification_divergences': report['classification_divergence_count'],
          }
          print(json.dumps(summary, indent=2))
          assert report['source_manifest_count'] == 305
          assert report['verified_source_count'] == 305
          assert report['fetch_failure_count'] == 0
          assert report['hash_mismatch_count'] == 0
          assert report.get('extraction_error_count', 0) == 0
          assert report['complete_ticker_count'] == report['tickers_with_guidance_payload'] == 109
          assert report['quarantined_fact_count'] <= 165
          assert report['classification_divergence_count'] <= 13
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-repair-v11-prepublish-replay
          path: semantic-repair-v11-replay.json
          if-no-files-found: error
      - name: Publish repair batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/guidance_raw_canonical_extractor.py backend/tests/test_guidance_raw_canonical_extractor.py
          git diff --cached --check
          git commit -m "Phase 1.1E: finalize canonical semantic repair [semantic-repair-v11]"
          git push origin HEAD:phase-1.1e-canonical-guidance
