name: Phase 1.1E Semantic Repair

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: write

jobs:
  semantic-repair:
    if: ${{ startsWith(github.event.head_commit.message, 'Trigger Phase 1.1E semantic repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply semantic repair batch
        run: python scripts/phase_1_1e_semantic_repair_v4.py
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run semantic regression suite
        env:
          DATABASE_URL: sqlite+pysqlite:///./soe_semantic_repair.db
          PROVIDER_NAME: fixture
          SEC_USER_AGENT: "SwingOpportunityEngine-SemanticRepair/1.0 (ci@example.invalid)"
        run: python -m pytest -q backend/tests/test_guidance_raw_canonical_extractor.py backend/tests/test_guidance_canonical.py backend/tests/test_guidance_intelligence.py
      - name: Publish repair batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/guidance_raw_canonical_extractor.py backend/app/services/guidance_raw_typed_extractor.py backend/tests/test_guidance_raw_canonical_extractor.py
          git diff --cached --check
          git commit -m "Phase 1.1E: repair raw guidance semantic binding [semantic-repair]"
          git push origin HEAD:phase-1.1e-canonical-guidance
