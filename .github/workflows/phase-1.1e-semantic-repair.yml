name: Phase 1.1E Consolidated Source Acceptance

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance
    paths:
      - '.github/workflows/phase-1.1e-semantic-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  survivor-semantic-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Apply exact approved survivor semantic repair batch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase-1.1e-survivor-semantic-repair.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          repair_source = textwrap.dedent(workflow[start:end])
          exec(compile(repair_source, '<phase-1.1e-survivor-semantic-repair>', 'exec'), {})
          PY

      - name: Compile repaired guidance code
        run: |
          python -m py_compile \
            backend/app/services/guidance_raw_typed_extractor.py \
            backend/app/services/guidance_raw_canonical_extractor.py \
            backend/tests/test_guidance_survivor_semantic_regressions.py

      - name: Run focused semantic ownership regressions
        run: |
          pytest -q \
            backend/tests/test_guidance_survivor_semantic_regressions.py \
            backend/tests/test_guidance_range_revision_ownership.py \
            backend/tests/test_guidance_semantic_ownership_audit_regressions.py \
            backend/tests/test_guidance_semantic_ownership_repair.py \
            backend/tests/test_canonical_shadow_guidance_integration.py \
            backend/tests/test_guidance_raw_replay_differential.py

      - name: Run complete deterministic suite
        run: pytest -q

      - name: Verify frozen SOE rules and IEE boundary
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"
          git diff --exit-code origin/main -- config/soe_v1_0_rules.yaml
          if git diff --name-only origin/main...HEAD | grep -Ei 'investment.?execution|iee'; then
            echo 'IEE boundary changed unexpectedly.' >&2
            exit 1
          fi

      - name: Commit and push coherent semantic repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/services/guidance_raw_typed_extractor.py \
            backend/app/services/guidance_raw_canonical_extractor.py \
            backend/tests/test_guidance_survivor_semantic_regressions.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No production repair changes generated.' >&2
            exit 1
          fi
          git commit -m 'Phase 1.1E: harden survivor semantic ownership'
          git push origin HEAD:phase-1.1e-canonical-guidance
