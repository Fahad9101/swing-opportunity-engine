name: Phase 1.1E Survivor Semantic Repair Runner

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance
    paths:
      - '.github/workflows/phase-1.1e-semantic-repair.yml'
      - 'scripts/phase_1_1e_apply_survivor_repair.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Apply approved semantic repair payload
        run: python scripts/phase_1_1e_apply_survivor_repair.py

      - name: Compile repaired guidance code
        shell: bash
        run: |
          set +e
          python -m py_compile \
            backend/app/services/guidance_raw_typed_extractor.py \
            backend/app/services/guidance_raw_canonical_extractor.py \
            backend/app/services/guidance_semantic_ownership_service.py \
            backend/tests/test_guidance_survivor_semantic_regressions.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- generated raw typed extractor context ---'
            nl -ba backend/app/services/guidance_raw_typed_extractor.py | sed -n '425,470p'
            echo '--- generated canonical extractor context around compile failure ---'
            nl -ba backend/app/services/guidance_raw_canonical_extractor.py | sed -n '980,1065p'
            echo '--- generated canonical extractor period/role context ---'
            nl -ba backend/app/services/guidance_raw_canonical_extractor.py | sed -n '850,980p'
            exit "$status"
          fi

      - name: Run focused survivor semantic regressions
        run: pytest -q backend/tests/test_guidance_survivor_semantic_regressions.py

      - name: Run complete deterministic suite
        run: pytest -q

      - name: Verify frozen SOE rules and IEE boundary
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"
          git diff --exit-code origin/main -- config/soe_v1_0_rules.yaml
          if git diff --name-only origin/main...HEAD | grep -Ei 'investment.?execution|iee'; then
            echo 'IEE boundary changed unexpectedly.' >&2
            exit 1
          fi

      - name: Commit and push coherent production repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/services/guidance_raw_typed_extractor.py \
            backend/app/services/guidance_raw_canonical_extractor.py \
            backend/app/services/guidance_semantic_ownership_service.py \
            backend/tests/test_guidance_survivor_semantic_regressions.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No production repair changes generated.' >&2
            exit 1
          fi
          git commit -m 'Phase 1.1E: harden survivor semantic ownership'
          git push origin HEAD:phase-1.1e-canonical-guidance
