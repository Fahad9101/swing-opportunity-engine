name: Phase 1.1E Semantic Repair

# Diagnostic-only v13 corpus run. Never publishes extractor changes.
on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: read
  actions: read

jobs:
  semantic-repair:
    if: ${{ startsWith(github.event.head_commit.message, 'Trigger Phase 1.1E semantic repair') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_ARTIFACT_ID: '10296727219'
      SEC_USER_AGENT: 'SOE-SemanticRepair/1.0 (soe-validation@example.com)'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply v13 diagnostic repair in working tree
        run: python scripts/phase_1_1e_semantic_repair_v13.py
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run complete deterministic test suite
        env:
          DATABASE_URL: sqlite+pysqlite:///./soe_semantic_repair.db
          PROVIDER_NAME: fixture
        run: python -m pytest -q
      - name: Download immutable acceptance artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p semantic-replay-source
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o semantic-replay-source/source.zip
          unzip -q semantic-replay-source/source.zip -d semantic-replay-source/unpacked
          test -f semantic-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json
      - name: Replay complete immutable SEC population
        run: |
          python -m app.cli_guidance_raw_replay_differential \
            semantic-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json \
            --output semantic-repair-v13-diagnostic.json \
            --min-interval 0.15 \
            --retries 3
      - name: Print diagnostic metrics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('semantic-repair-v13-diagnostic.json'))
          print(json.dumps({
            'documents_verified': f"{r['verified_source_count']}/{r['source_manifest_count']}",
            'fetch_failures': r['fetch_failure_count'],
            'hash_mismatches': r['hash_mismatch_count'],
            'extraction_errors': r.get('extraction_error_count', 0),
            'complete_tickers': f"{r['complete_ticker_count']}/{r['tickers_with_guidance_payload']}",
            'raw_typed_facts': r['raw_typed_fact_count'],
            'canonical_facts': r['canonical_fact_count'],
            'quarantined': r['quarantined_fact_count'],
            'classification_divergences': r['classification_divergence_count'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-repair-v13-diagnostic
          path: semantic-repair-v13-diagnostic.json
          if-no-files-found: error
