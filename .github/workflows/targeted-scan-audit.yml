name: Targeted Real-Data Scanner Audit

on:
  push:
    branches: [milestone-2.5f-ownership-shortfloat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SOE
        run: python -m pip install -e '.[test]'

      - name: Run targeted real-data scanner audit
        env:
          DATABASE_URL: sqlite+pysqlite:///./soe_targeted_audit.db
          PROVIDER_NAME: free_public
          SEC_USER_AGENT: "SwingOpportunityEngine-Validation/1.0 (ci@example.invalid)"
          SEC_COMPANYFACTS_ZIP_PATH: .cache/soe/sec/nonexistent-companyfacts.zip
        run: PYTHONPATH=backend python -m app.cli_targeted_scan_audit
