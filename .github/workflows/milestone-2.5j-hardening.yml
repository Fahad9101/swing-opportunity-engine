name: Milestone 2.5J Free-Data Hardening

on:
  push:
    branches:
      - milestone-2.5j-free-data-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-2-5j:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      DATABASE_URL: sqlite+pysqlite:///./soe_milestone_2_5j.db
      PROVIDER_NAME: free_public
      SEC_USER_AGENT: "SwingOpportunityEngine-FinalValidation/1.0 (contact: GitHub/Fahad9101)"
      SEC_COMPANYFACTS_ZIP_PATH: .cache/soe/sec/companyfacts.zip
      SEC_SUBMISSIONS_ZIP_PATH: .cache/soe/sec/submissions.zip
      CACHE_DIR: .cache/soe
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify SOE-1.0.0 rules are byte-identical to main
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"
          echo "rules_blob_sha=$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)"

      - name: Run deterministic suite
        env:
          PROVIDER_NAME: fixture
        run: python -m pytest

      - name: Set SEC cache date
        shell: bash
        run: echo "SEC_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore validated SEC bulk cache
        uses: actions/cache@v4
        with:
          path: .cache/soe/sec
          key: ${{ runner.os }}-soe-sec-bulk-${{ env.SEC_CACHE_DATE }}
          restore-keys: |
            ${{ runner.os }}-soe-sec-bulk-

      - name: Attempt preferred SEC bulk archives
        id: sec_bulk
        continue-on-error: true
        run: PYTHONPATH=backend python -m app.cli_sec_bulk

      - name: Validate official SEC JSON fallback when bulk is unavailable
        if: steps.sec_bulk.outcome != 'success'
        shell: bash
        run: |
          PYTHONPATH=backend python - <<'PY'
          import asyncio
          import json
          from app.providers.provider_registry import get_provider

          async def main():
              provider = get_provider('free_public')
              result = await provider.sec.network_smoke_test()
              print(json.dumps(result, indent=2))

          asyncio.run(main())
          PY

      - name: Run Milestone 2.5J full-market validation
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=backend python -m app.cli_milestone_2_5j_validation \
            --json-out milestone_2_5j_validation.json \
            --markdown-out MILESTONE_2_5J_REPORT.md \
            2>&1 | tee milestone_2_5j_validation.log

      - name: Upload Milestone 2.5J artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-2.5j-free-data-hardening
          if-no-files-found: warn
          retention-days: 30
          path: |
            milestone_2_5j_validation.json
            MILESTONE_2_5J_REPORT.md
            milestone_2_5j_validation.log
