name: Phase 1.1E Semantic Repair Tests

on:
  push:
    branches:
      - phase-1.1e-semantic-repair-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+pysqlite:///./soe_ci.db
      PROVIDER_NAME: fixture
      SEC_USER_AGENT: SwingOpportunityEngine-CI/1.0 (ci@example.invalid)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run semantic ownership repair regressions
        run: python -m pytest backend/tests/test_guidance_semantic_ownership_repair.py -q
      - name: Run complete deterministic suite
        run: python -m pytest -q
      - name: Verify frozen SOE-1.0.0 rules blob against canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 70b9f9230ff943a90f2045608b9a580963dff100 --depth=1
          test "$(git rev-parse 70b9f9230ff943a90f2045608b9a580963dff100:config/soe_v1_0_rules.yaml)" = "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)"
