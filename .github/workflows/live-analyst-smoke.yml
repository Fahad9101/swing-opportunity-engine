name: Live Nasdaq Analyst Smoke

on:
  push:
    branches: [milestone-2.5c-live-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SOE
        run: python -m pip install -e '.[test]'

      - name: Query live key-free Nasdaq analyst forecasts
        env:
          DATABASE_URL: sqlite+pysqlite:///./soe_smoke.db
          PROVIDER_NAME: free_public
          SEC_USER_AGENT: "SwingOpportunityEngine-Smoke/1.0 (ci@example.invalid)"
        run: PYTHONPATH=backend python -m app.cli_live_analyst_smoke
