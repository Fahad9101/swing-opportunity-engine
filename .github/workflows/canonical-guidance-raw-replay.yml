name: Canonical Guidance Raw SEC Replay

# Acceptance replay trigger: post-semantic-repair validation.
on:
  push:
    branches: [phase-1.1e-canonical-guidance]
    paths:
      - 'backend/app/services/guidance_raw_typed_extractor.py'
      - 'backend/app/services/guidance_raw_canonical_extractor.py'
      - 'backend/app/services/guidance_raw_replay_differential_service.py'
      - 'backend/app/cli_guidance_raw_replay_differential.py'
      - 'backend/tests/fixtures/guidance_raw_extraction_corpus_v1.json'
      - 'backend/tests/test_guidance_raw_*.py'
      - '.github/workflows/canonical-guidance-raw-replay.yml'
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Phase 1.1E shadow-validation artifact ID'
        required: false
        default: '10296727219'

concurrency:
  group: canonical-guidance-raw-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_ARTIFACT_ID: ${{ inputs.artifact_id || '10296727219' }}
      SEC_USER_AGENT: 'SOE-Canonical-Replay/1.0 (soe-validation@example.com)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Download immutable acceptance artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw-replay-source
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o raw-replay-source/source.zip
          unzip -q raw-replay-source/source.zip -d raw-replay-source/unpacked
          test -f raw-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json
      - name: Replay exact SEC documents through canonical architecture
        run: |
          python -m app.cli_guidance_raw_replay_differential \
            raw-replay-source/unpacked/validation-results/milestone-1.1e/shadow_validation.json \
            --output canonical-guidance-raw-replay.json \
            --min-interval 0.15 \
            --retries 3
          python - <<'PY'
          import json
          report = json.load(open('canonical-guidance-raw-replay.json'))
          print(json.dumps({
              'documents_verified': f"{report['verified_source_count']}/{report['source_manifest_count']}",
              'fetch_failures': report['fetch_failure_count'],
              'hash_mismatches': report['hash_mismatch_count'],
              'extraction_errors': report.get('extraction_error_count', 0),
              'complete_tickers': f"{report['complete_ticker_count']}/{report['tickers_with_guidance_payload']}",
              'raw_typed_facts': report['raw_typed_fact_count'],
              'canonical_facts': report['canonical_fact_count'],
              'quarantined': report['quarantined_fact_count'],
              'classification_divergences': report['classification_divergence_count'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-guidance-raw-sec-replay
          path: canonical-guidance-raw-replay.json
          if-no-files-found: error
