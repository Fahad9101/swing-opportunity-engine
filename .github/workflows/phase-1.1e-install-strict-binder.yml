name: Phase 1.1E Install Strict Guidance Binder

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance
    paths:
      - '.github/workflows/phase-1.1e-install-strict-binder.yml'
      - '.github/scripts/phase_1_1e_install_strict_binder.py'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify SOE-1.0.0 remains frozen
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"
          echo "frozen_rules_blob_sha=$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)"

      - name: Install strict evidence binder into canonical path
        run: python .github/scripts/phase_1_1e_install_strict_binder.py

      - name: Run strict binder and canonical guidance regressions
        run: |
          python -m pytest backend/tests/test_guidance_evidence_binder.py \
            backend/tests/test_guidance_manual_audit_regressions.py \
            backend/tests/test_guidance_raw_canonical_extractor.py \
            backend/tests/test_canonical_shadow_guidance_integration.py

      - name: Run full deterministic suite
        env:
          PROVIDER_NAME: fixture
          DATABASE_URL: sqlite+pysqlite:///./soe_phase_1_1e_ci.db
        run: python -m pytest

      - name: Commit validated binder integration
        shell: bash
        run: |
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/canonical_shadow_guidance_service.py \
            backend/app/services/guidance_evidence_binder.py
          if git diff --cached --quiet; then
            echo 'No binder integration changes to commit.'
            exit 0
          fi
          git commit -m 'Phase 1.1E: gate canonical guidance through strict evidence binder'
          git push origin HEAD:phase-1.1e-canonical-guidance
