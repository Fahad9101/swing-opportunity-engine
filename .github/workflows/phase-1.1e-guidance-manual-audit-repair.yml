name: Phase 1.1E Guidance Manual-Audit Repair

on:
  push:
    branches: [phase-1.1e-canonical-guidance]

permissions:
  contents: write

jobs:
  repair:
    if: startsWith(github.event.head_commit.message, 'Run Phase 1.1E manual-audit guidance repair')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Apply coherent source-level guidance audit repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/guidance_raw_canonical_extractor.py')
          text = path.read_text()
          marker = '\ndef _suppress_document_fragments(facts: Iterable[TypedGuidanceFact], rejected: list[dict]) -> list[TypedGuidanceFact]:\n'
          if '_manual_audit_semantic_reason_v33' in text:
              raise SystemExit('v33 repair already present')
          if marker not in text:
              raise SystemExit('source insertion marker not found')

          helper = r'''

# Phase 1.1E manual-audit hardening. These guards are deliberately conservative:
# they reject ambiguous/non-guidance evidence rather than inventing a comparator.
# Frozen SOE thresholds and classifier rules are unchanged.
_FORMAL_GUIDANCE_NOUN_V33 = re.compile(r"\b(?:guidance|outlook|forecast)\b", re.I)
_THREE_MONTH_OUTLOOK_V33 = re.compile(
    r"\b(?:outlook|guidance)\s+for\s+(?:the\s+)?three\s+months?\s+ending\b"
    r"|\bthree\s+months?\s+ending\b.{0,90}\b(?:outlook|guidance)\b",
    re.I | re.S,
)
_PARALLEL_QUARTER_V33 = re.compile(
    r"\b(?:Q[1-4]\s*(?:FY)?\s*'?20\d{2}|FY\s*20\d{2}\s+Q[1-4]|"
    r"(?:first|second|third|fourth)\s+quarter(?:\s+(?:of|fiscal(?:\s+year)?))?\s+20\d{2})\b",
    re.I,
)
_PARALLEL_FULL_YEAR_V33 = re.compile(
    r"\b(?:full[- ]year\s+20\d{2}|FY\s*20\d{2}\s+(?:guidance|outlook))\b",
    re.I,
)
_PARALLEL_COLUMNS_V33 = re.compile(
    r"\blow\s+high\b.{0,140}\blow\s+high\b"
    r"|\bFY\s*20\d{2}\s+Q[1-4]\s+guidance\b.{0,100}\bFY\s*20\d{2}\s+guidance\b",
    re.I | re.S,
)
_OUTLOOK_ACTUAL_COLUMNS_V33 = re.compile(
    r"\bFY\s*(20\d{2})\s+outlook\b.{0,120}\bFY\s*(20\d{2})\s+actual\b",
    re.I | re.S,
)


def _manual_audit_semantic_reason_v33(fact: TypedGuidanceFact) -> str | None:
    if not fact.provenance:
        return None
    evidence = fact.provenance[0].evidence
    clause = evidence.full_text or ''
    if not clause:
        return None
    ms, me = evidence.metric_start, evidence.metric_end
    vs, ve = evidence.value_start, evidence.value_end

    # LOWER/WITHDRAW must be guidance-local. Ordinary lower costs, lower demand,
    # lower year-over-year revenue, or rate cuts are not formal guidance actions.
    if (
        fact.value_kind is GuidanceValueKind.QUALITATIVE
        and fact.explicit_action in {GuidanceAction.LOWER, GuidanceAction.WITHDRAW}
        and ms is not None
    ):
        local = clause[max(0, ms - 180):min(len(clause), (me or ms) + 180)]
        if not _FORMAL_GUIDANCE_NOUN_V33.search(local) and not re.search(
            r"\b(?:range|target|projection)s?\b", local, re.I
        ):
            return 'directional_action_not_guidance_local'

    # A three-month outlook is not full-year guidance merely because the calendar
    # year appears in the ending date.
    if fact.period_kind is GuidancePeriodKind.FULL_YEAR and _THREE_MONTH_OUTLOOK_V33.search(clause):
        return 'three_month_outlook_misbound_full_year'

    # Flattened tables with simultaneous quarter and full-year columns are not
    # safe for a one-dimensional nearest-value binder. Fail closed instead of
    # comparing the first quarter column as annual guidance.
    if (
        _PARALLEL_QUARTER_V33.search(clause)
        and _PARALLEL_FULL_YEAR_V33.search(clause)
        and _PARALLEL_COLUMNS_V33.search(clause)
    ):
        return 'ambiguous_parallel_quarter_full_year_columns'

    # Likewise, do not bind a value under the Actual column to the preceding
    # Outlook year simply because it is closer to the metric label.
    outlook_actual = _OUTLOOK_ACTUAL_COLUMNS_V33.search(clause)
    if outlook_actual and fact.fiscal_period == f"FY{outlook_actual.group(2)}":
        return 'outlook_actual_column_period_misbind'

    if ms is not None:
        metric_local = clause[max(0, ms - 45):min(len(clause), (me or ms) + 45)]
        if fact.metric is GuidanceMetric.REVENUE and re.search(
            r"\bcosts?\s+of\s+(?:contract\s+)?revenue\b", metric_local, re.I
        ):
            return 'revenue_token_inside_cost_metric'

    if vs is not None and ve is not None:
        before = clause[max(0, vs - 260):vs]
        after = clause[ve:min(len(clause), ve + 120)]

        # Realized financial highlights/results followed by YoY comparison are
        # historical actuals, not forward guidance.
        if (
            re.search(r"\bfinancial\s+(?:results|highlights)\b", before, re.I)
            and re.match(r"\s*,?\s*(?:up|down)\s+\d+(?:\.\d+)?%", after, re.I)
        ):
            return 'financial_highlights_actual'

        # Dollar amount in "up/down ... YoY" is a change, not a guidance level.
        if (
            re.search(r"\b(?:up|down)\s+(?:by\s+|more\s+than\s+|approximately\s+)?\$?\s*$", before, re.I)
            and re.match(r"\s*(?:million|billion|thousand|mm|bn|m|b)?\s*(?:YoY|Y/Y|year[- ]over[- ]year)\b", after, re.I)
        ):
            return 'yoy_change_not_guidance_level'

        # Flattened revised-guidance rows can put two Net Income ranges directly
        # before the EBITDA label. Do not let the second Net Income range become
        # a same-snapshot quoted-prior EBITDA value.
        if fact.metric is GuidanceMetric.EBITDA and ve <= (ms if ms is not None else ve):
            local = clause[max(0, vs - 220):min(len(clause), (me or ve) + 40)]
            money_range = r"\$?\s*\d[\d,]*(?:\.\d+)?\s*(?:-|–|—|to)\s*\$?\s*\d[\d,]*(?:\.\d+)?"
            if (
                re.search(r"\bnet\s+(?:income|loss)\b", local, re.I)
                and len(re.findall(money_range, local, re.I)) >= 2
            ):
                return 'parallel_row_value_owned_by_net_income'

    return None


def _suppress_manual_audit_defects_v33(
    facts: Iterable[TypedGuidanceFact],
    rejected: list[dict],
) -> list[TypedGuidanceFact]:
    kept: list[TypedGuidanceFact] = []
    for fact in facts:
        reason = _manual_audit_semantic_reason_v33(fact)
        if reason is None:
            kept.append(fact)
            continue
        rejected.append({
            'reason': reason,
            'metric': fact.metric.value,
            'period': fact.fiscal_period,
            'value': [fact.low, fact.high],
        })
    return kept
'''
          text = text.replace(marker, helper + marker, 1)
          old = "    facts = _suppress_document_fragments(facts, rejected)\n    facts = _suppress_semantic_aliases_v29(facts, rejected)\n"
          new = "    facts = _suppress_manual_audit_defects_v33(facts, rejected)\n    facts = _suppress_document_fragments(facts, rejected)\n    facts = _suppress_semantic_aliases_v29(facts, rejected)\n"
          if old not in text:
              raise SystemExit('final filter marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > backend/tests/test_guidance_manual_audit_regressions.py <<'PY'
          from __future__ import annotations

          import hashlib
          from datetime import UTC, datetime

          from app.domain.soe_v1_1 import GuidanceAction, SourceDocument
          from app.services.guidance_raw_canonical_extractor import extract_canonical_typed_guidance_facts


          def _doc(ticker: str, text: str) -> SourceDocument:
              ts = datetime(2026, 9, 14, tzinfo=UTC)
              digest = hashlib.sha256(text.encode()).hexdigest()
              return SourceDocument(
                  document_id=f'audit-{ticker}-{digest[:12]}', rules_hash='audit', ticker=ticker,
                  cik='0000000001', accession='0000000001-26-999999', form='8-K', filing_date=ts.date(),
                  source_url=f'https://www.sec.gov/Archives/edgar/data/1/{ticker.lower()}.htm',
                  source_timestamp=ts, fetched_at=ts, content_hash=digest, content_type='text/plain', content=text,
              )


          def _facts(ticker: str, text: str):
              return list(extract_canonical_typed_guidance_facts(_doc(ticker, text)).facts)


          def test_ordinary_lower_revenue_expectation_is_not_a_guidance_cut():
              facts = _facts('IESC', 'This is expected to result in lower multi-family revenues in fiscal 2026 as compared with the prior year.')
              assert not any(f.explicit_action is GuidanceAction.LOWER for f in facts)


          def test_lower_operating_costs_do_not_lower_free_cash_flow_guidance():
              facts = _facts('CRGY', 'The combination of higher expected production and lower operating costs is expected to support incremental free cash flow generation in 2026.')
              assert not any(f.explicit_action is GuidanceAction.LOWER for f in facts)


          def test_rate_cut_commentary_is_not_revenue_guidance_withdrawal_or_cut():
              facts = _facts('HOOD', 'The Federal Reserve lowered interest rates by 100 basis points, which negatively impacted our net interest revenues. We anticipate future rate cuts may have a similar impact.')
              assert not any(f.explicit_action in {GuidanceAction.LOWER, GuidanceAction.WITHDRAW} for f in facts)


          def test_three_month_outlook_does_not_become_full_year_margin_guidance():
              facts = _facts('ALAB', 'Outlook for Three Months Ending September 30, 2026 Low High GAAP gross margin 72 % Non-GAAP gross margin 75 %.')
              assert not any(f.fiscal_period == 'FY2026' and f.metric.value == 'gross_margin' for f in facts)


          def test_parallel_quarter_and_full_year_columns_fail_closed():
              rblx = _facts('RBLX', 'Guidance Q3 2026 Full Year 2026 ($ in millions) Low High Low High Revenue $1,413 $1,490 $5,865 $6,135.')
              assert not rblx
              brze = _facts('BRZE', 'Metric FY 2027 Q3 Guidance FY 2027 Guidance Revenue $229.0 - $230.0 $900.0 - $910.0.')
              assert not brze


          def test_contract_revenue_cost_change_is_not_revenue_guidance():
              facts = _facts('WLDN', 'Fiscal Year 2026 Financial Targets Net Revenue between $410 million and $425 million. Direct costs of contract revenue in our Energy segment decreased $3.5 million, or 4.3%, for the three months ended April 3, 2026.')
              assert not any(f.metric.value == 'revenue' and f.low == 3.5 for f in facts)


          def test_financial_highlights_actual_is_not_forward_guidance():
              facts = _facts('BTSG', 'Increased 2025 Revenue guidance: $12,200 - $12,600 million. Fourth Quarter 2025 Financial Highlights. Net revenue of $3,551 million, up 29.3% compared to $2,747 million in the fourth quarter of 2024.')
              assert not any(f.metric.value == 'revenue' and f.low == 3551 for f in facts)


          def test_yoy_change_amount_is_not_adjusted_ebitda_guidance_level():
              facts = _facts('CVNA', 'Record Full Year Adjusted EBITDA of $2.2 billion, up more than $850 million YoY. Expects Significant Growth in Adjusted EBITDA in FY 2026.')
              assert not any(f.metric.value == 'ebitda' and f.low == 850 for f in facts)


          def test_net_income_ranges_do_not_become_prior_ebitda_value():
              facts = _facts('OPLN', 'Revised Guidance (August 4, 2026) Net income (in millions) $147 - $164 $163 - $176 Adjusted EBITDA (in millions) $360 - $380 $385 - $400.')
              assert not any(f.metric.value == 'ebitda' and f.low in {163, 147} and f.high in {176, 164} for f in facts)


          def test_formal_numeric_outlook_cut_remains_extractable():
              facts = _facts('TFX', 'The Company reduced its full year 2026 GAAP diluted earnings per share outlook range to $2.54 to $2.84.')
              assert any(f.metric.value == 'eps' and f.explicit_action is GuidanceAction.LOWER for f in facts)
          PY

      - name: Run guidance regression tests
        run: |
          python -m pytest backend/tests/test_guidance_manual_audit_regressions.py backend/tests/test_canonical_shadow_guidance_integration.py -q
      - name: Run full deterministic suite
        env:
          PROVIDER_NAME: fixture
          DATABASE_URL: sqlite+pysqlite:///./soe_phase_1_1e_audit_repair_ci.db
        run: python -m pytest -q
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/guidance_raw_canonical_extractor.py backend/tests/test_guidance_manual_audit_regressions.py
          git diff --cached --quiet && exit 1
          git commit -m 'Phase 1.1E: harden guidance evidence after manual audit'
          git push origin HEAD:phase-1.1e-canonical-guidance
