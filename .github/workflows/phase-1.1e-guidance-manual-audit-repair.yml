name: Phase 1.1E Guidance Manual-Audit Repair

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance

permissions:
  contents: write

jobs:
  repair:
    if: ${{ startsWith(github.event.head_commit.message, 'Run Phase 1.1E manual-audit guidance repair') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e '.[test]'

      - name: Verify SOE-1.0.0 remains frozen
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"

      - name: Apply coherent source-level guidance audit repair
        run: python .github/scripts/phase_1_1e_guidance_manual_audit_repair.py

      - name: Run guidance regression tests
        run: python -m pytest backend/tests/test_guidance_manual_audit_regressions.py backend/tests/test_canonical_shadow_guidance_integration.py -q

      - name: Run full deterministic suite
        env:
          PROVIDER_NAME: fixture
          DATABASE_URL: sqlite+pysqlite:///./soe_phase_1_1e_audit_repair_ci.db
        run: python -m pytest -q

      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/guidance_raw_canonical_extractor.py backend/tests/test_guidance_manual_audit_regressions.py
          git diff --cached --quiet && exit 1
          git commit -m 'Phase 1.1E: harden guidance evidence after manual audit'
          git push origin HEAD:phase-1.1e-canonical-guidance
