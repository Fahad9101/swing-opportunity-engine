name: Phase 1.1E Promote Strict V3

# Promotion retry after semantic quarantine diagnostics were hardened.
on:
  push:
    branches:
      - phase-1.1e-canonical-guidance
    paths:
      - '.github/workflows/phase-1.1e-promote-strict-v3.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Promote strict-v3 into canonical path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/canonical_shadow_guidance_service.py')
          text = path.read_text()
          old_import = 'from app.services.guidance_evidence_binder_v2 import GuidanceEvidenceBinder'
          new_import = 'from app.services.guidance_evidence_binder_v3 import GuidanceEvidenceBinder'
          if new_import not in text:
              assert text.count(old_import) == 1, 'canonical binder import changed unexpectedly'
              text = text.replace(old_import, new_import, 1)
          text = text.replace('"evidence_binder_version": "strict-v2"', '"evidence_binder_version": "strict-v3"')
          path.write_text(text)
          PY

      - name: Compile semantic guidance path
        run: python -m py_compile backend/app/services/guidance_evidence_binder_v3.py backend/app/services/canonical_shadow_guidance_service.py backend/tests/test_guidance_semantic_ownership_closure.py

      - name: Run semantic ownership and historical guidance regressions
        run: |
          pytest -q \
            backend/tests/test_guidance_semantic_ownership_closure.py \
            backend/tests/test_guidance_table_coordinate_ownership.py \
            backend/tests/test_guidance_evidence_binder_v2.py \
            backend/tests/test_guidance_manual_audit_regressions.py \
            backend/tests/test_canonical_shadow_guidance_integration.py

      - name: Run complete deterministic suite
        run: pytest -q

      - name: Verify SOE-1.0.0 remains frozen
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD:config/soe_v1_0_rules.yaml)" = "$(git rev-parse origin/main:config/soe_v1_0_rules.yaml)"
          git diff --exit-code origin/main -- config/soe_v1_0_rules.yaml

      - name: Commit and push strict-v3 canonical promotion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/canonical_shadow_guidance_service.py
          if git diff --cached --quiet; then
            echo 'Canonical path already on strict-v3.'
            exit 0
          fi
          git commit -m 'Phase 1.1E: promote final semantic ownership binder'
          git push origin HEAD:phase-1.1e-canonical-guidance
