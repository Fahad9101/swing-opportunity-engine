name: Phase 1.1E Range Revision Locality Diagnostic

on:
  push:
    branches:
      - phase-1.1e-canonical-guidance
    paths:
      - .github/workflows/phase-1.1e-range-revision-locality-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.1e-canonical-guidance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Apply intended locality change in runner and print semantic path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/guidance_raw_canonical_extractor.py')
          text = path.read_text()
          old = '    range_revision = _FROM_RANGE_TO_RANGE_MONEY.search(clause)\n'
          new = '''    range_revision = _FROM_RANGE_TO_RANGE_MONEY.search(\n        clause, anchor + len(mention.text)\n    )\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          PYTHONPATH=backend python - <<'PY'
          import hashlib
          from datetime import UTC, datetime
          from app.domain.soe_v1_1 import SourceDocument
          from app.services.fact_extraction_service import html_to_text
          from app.services.guidance_raw_typed_extractor import _segments, _metric_mentions, _metric_clause
          from app.services.guidance_raw_canonical_extractor import (
              extract_canonical_typed_guidance_facts,
              _metric_action,
              _directional_value_pair,
              _canonical_period_binding,
              _nearest_section_heading_period,
              _document_heading_period,
          )

          text = (
              'For 2026, the company is increasing total revenue guidance '
              'from a range of $250 million to $260 million to a range of $260 million to $270 million '
              'and raising adjusted EBITDA guidance from a range of $40 million to $45 million '
              'to a range of $50 million to $55 million.'
          )
          ts = datetime(2026, 9, 15, tzinfo=UTC)
          digest = hashlib.sha256(text.encode()).hexdigest()
          doc = SourceDocument(
              document_id='diag', rules_hash='candidate-hash', ticker='TEST', cik='0000000001',
              accession='0000000001-26-999995', form='8-K', filing_date=ts.date(),
              source_url='https://www.sec.gov/Archives/edgar/data/1/diag.htm',
              source_timestamp=ts, fetched_at=ts, content_hash=digest, content_type='text/plain', content=text,
          )
          flat = html_to_text(text)
          print('=== RAW TEXT ===')
          print(flat)
          print('=== CLAUSES ===')
          for segment in _segments(flat):
              mentions = _metric_mentions(segment)
              print('SEGMENT:', repr(segment))
              print('MENTIONS:', [(m.metric.value, m.text, m.start, m.end) for m in mentions])
              for idx, mention in enumerate(mentions):
                  clause, anchor = _metric_clause(segment, mentions, idx)
                  action = _metric_action(segment, clause, anchor, mention)
                  current, prior = _directional_value_pair(clause, anchor, mention, action)
                  period = _canonical_period_binding(clause, anchor, mention)
                  section = _nearest_section_heading_period(segment, clause, anchor, mention)
                  doc_period = _document_heading_period(flat, segment, clause, anchor, mention)
                  print('METRIC:', mention.metric.value)
                  print('CLAUSE:', repr(clause))
                  print('ANCHOR:', anchor)
                  print('ACTION:', action.value)
                  print('PAIR CURRENT:', None if current is None else (current.low, current.high, current.unit.value, current.text, current.start, current.end))
                  print('PAIR PRIOR:', None if prior is None else (prior.low, prior.high, prior.unit.value, prior.text, prior.start, prior.end))
                  print('CANONICAL PERIOD:', None if period is None else (period.period, period.text, period.start, period.end))
                  print('SECTION PERIOD:', None if section is None else (section.period, section.text, section.start, section.end))
                  print('DOCUMENT PERIOD:', None if doc_period is None else (doc_period.period, doc_period.text, doc_period.start, doc_period.end))

          result = extract_canonical_typed_guidance_facts(doc)
          print('=== FINAL FACTS ===')
          for fact in result.facts:
              print({
                  'metric': fact.metric.value,
                  'role': fact.role.value,
                  'period': fact.fiscal_period,
                  'action': fact.explicit_action.value,
                  'low': fact.low,
                  'high': fact.high,
                  'unit': fact.unit.value,
                  'value_text': fact.provenance[0].evidence.value_text,
                  'full_text': fact.provenance[0].evidence.full_text,
              })
          print('=== REJECTED ===')
          for row in result.rejected_candidates:
              print(row)
          PY
