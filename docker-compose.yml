services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: soe
      POSTGRES_USER: soe
      POSTGRES_PASSWORD: soe
    ports:
      - "5432:5432"
    volumes:
      - soe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soe -d soe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soe_postgres:

